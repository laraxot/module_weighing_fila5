name: HTML Structure Compare

on:
  push:
    branches: [develop, main]
    paths:
      - 'laravel/Themes/Sixteen/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'laravel/Themes/Sixteen/**'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    environment: Testing

    services:
      php-server:
        image: php:8.4-cli
        ports:
          - 8000:8000
        options: >-
          --entrypoint php
          -S 0.0.0.0:8000 -t /var/www/html

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Start Laravel dev server
        run: |
          cd laravel
          php -S 127.0.0.1:8000 -t public &
          sleep 3
          echo "Server started"
        timeout-minutes: 2

      - name: Compare HTML structure
        run: |
          php laravel/compare-html.php \
            "https://italia.github.io/design-comuni-pagine-statiche/sito/homepage.html" \
            "http://127.0.0.1:8000/it/tests/homepage"
