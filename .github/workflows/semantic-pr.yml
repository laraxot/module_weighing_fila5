name: Semantic PR Title

# Verifica che il TITOLO della Pull Request rispetti i Conventional Commits.
# Il titolo PR e' cio' che finisce nel commit di merge (squash) e quindi
# alimenta release-please: deve essere semanticamente valido.
# Action ufficiale: amannn/action-semantic-pull-request.

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  semantic-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Lint PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Tipi allineati a commitlint.config.cjs e a release-please-config.json
          types: |
            feat
            fix
            perf
            refactor
            revert
            docs
            test
            build
            ci
            style
            chore
          requireScope: false
          # Il subject (descrizione) non deve iniziare con maiuscola.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            Il subject "{subject}" del titolo PR "{title}" deve iniziare in minuscolo.
