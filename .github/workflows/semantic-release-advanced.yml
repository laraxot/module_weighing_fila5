name: Semantic Release & Advanced Changelog

on:
  push:
    branches:
      - main
      - dev
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  repository-projects: read

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    name: Semantic Release & Changelog

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install semantic-release & plugins
        run: |
          npm install --save-dev \
            semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            conventional-changelog-conventionalcommits

      - name: Make changelog script executable
        run: chmod +x bashscripts/release/changelog-advanced.js

      - name: Configure git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"

      - name: Upload Changelogs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changelogs-${{ github.run_id }}
          path: |
            docs/changelogs/CHANGELOG.md
            docs/changelogs/weekly/
          retention-days: 90
          if-no-files-found: ignore

      - name: Create deployment status
        if: success()
        run: |
          echo "✅ Semantic release completed successfully"
          echo "📝 Changelog: docs/changelogs/CHANGELOG.md"
          echo "📅 Weekly changelog: docs/changelogs/weekly/"
