# Semantic release orchestrato: root + moduli Laravel + temi Sixteen.
# I workflow in sottocartelle Modules/*/.github non partono su monorepo — usare questo file.
name: Semantic Release Monorepo

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      package:
        description: Package da rilasciare (all | root | Geo | …)
        required: false
        default: all
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          ALL='[
            {"dir":".","label":"fixcity-root","id":"root"},
            {"dir":"laravel/Modules/Activity","label":"Activity","id":"activity"},
            {"dir":"laravel/Modules/AI","label":"AI","id":"ai"},
            {"dir":"laravel/Modules/Blog","label":"Blog","id":"blog"},
            {"dir":"laravel/Modules/Cms","label":"Cms","id":"cms"},
            {"dir":"laravel/Modules/Comment","label":"Comment","id":"comment"},
            {"dir":"laravel/Modules/Fixcity","label":"Fixcity","id":"fixcity"},
            {"dir":"laravel/Modules/Geo","label":"Geo","id":"geo"},
            {"dir":"laravel/Modules/Gdpr","label":"Gdpr","id":"gdpr"},
            {"dir":"laravel/Modules/Job","label":"Job","id":"job"},
            {"dir":"laravel/Modules/Lang","label":"Lang","id":"lang"},
            {"dir":"laravel/Modules/Media","label":"Media","id":"media"},
            {"dir":"laravel/Modules/Notify","label":"Notify","id":"notify"},
            {"dir":"laravel/Modules/Rating","label":"Rating","id":"rating"},
            {"dir":"laravel/Modules/Seo","label":"Seo","id":"seo"},
            {"dir":"laravel/Modules/Sixteen","label":"Sixteen-module","id":"sixteen-module"},
            {"dir":"laravel/Modules/Tenant","label":"Tenant","id":"tenant"},
            {"dir":"laravel/Modules/UI","label":"UI","id":"ui"},
            {"dir":"laravel/Modules/User","label":"User","id":"user"},
            {"dir":"laravel/Modules/Xot","label":"Xot","id":"xot"},
            {"dir":"laravel/Modules/docs","label":"docs","id":"docs"},
            {"dir":"laravel/Themes/Sixteen","label":"Sixteen","id":"sixteen"},
            {"dir":"laravel/Themes/TwentyOne","label":"TwentyOne","id":"twentyone"},
            {"dir":"laravel/Themes/Barthelemy","label":"Barthelemy","id":"barthelemy"},
            {"dir":"laravel/Themes/Meetup","label":"Meetup","id":"meetup"}
          ]'
          REQ="${{ github.event.inputs.package }}"
          if [ -z "$REQ" ] || [ "$REQ" = "all" ]; then
            echo "matrix={\"include\":$ALL}" >> "$GITHUB_OUTPUT"
          else
            FILTERED=$(echo "$ALL" | jq -c --arg p "$REQ" '[.[] | select(.id == $p or .label == $p)]')
            echo "matrix={\"include\":$FILTERED}" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: resolve-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-matrix.outputs.matrix) }}
    uses: ./.github/workflows/reusable-semantic-release.yml
    with:
      working_directory: ${{ matrix.dir }}
      package_label: ${{ matrix.label }}
      enable_changelog_advanced: ${{ matrix.id == 'root' }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
