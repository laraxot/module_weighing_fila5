name: Reusable Semantic Release

on:
  workflow_call:
    inputs:
      working_directory:
        description: Directory containing .releaserc.json (default repo root)
        required: false
        type: string
        default: '.'
      package_label:
        description: Label for logs (monorepo matrix)
        required: false
        type: string
        default: ''
      enable_changelog_advanced:
        description: Enable advanced changelog with contributor stats
        required: false
        type: boolean
        default: false
    secrets:
      github-token:
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install semantic-release toolchain
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/github \
            @semantic-release/git \
            conventional-changelog-conventionalcommits

      - name: Setup advanced changelog (root only)
        if: ${{ inputs.enable_changelog_advanced == true && inputs.working_directory == '.' }}
        run: |
          chmod +x bashscripts/release/changelog-advanced.js
          echo "Advanced changelog enabled for root package"

      - name: Configure git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Release (${{ inputs.package_label || inputs.working_directory }})
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
        run: npx semantic-release
