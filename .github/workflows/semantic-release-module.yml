name: Semantic Release - Module

on:
  workflow_call:
    inputs:
      module_path:
        required: true
        type: string
        description: 'Path to module (e.g., laravel/Modules/User)'
      module_name:
        required: true
        type: string
        description: 'Module name (e.g., User)'

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Release Module - ${{ inputs.module_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Install semantic-release
        run: |
          npm install --global \
            semantic-release@^24.0.0 \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            conventional-changelog-conventionalcommits

      - name: Configure git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Run semantic-release for module
        run: |
          cd ${{ inputs.module_path }}
          npx semantic-release -e semantic-release/lib/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"

      - name: Upload module changelog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-changelog-${{ inputs.module_name }}
          path: ${{ inputs.module_path }}/CHANGELOG.md
          if-no-files-found: ignore
          retention-days: 90

      - name: Notify release
        if: success()
        run: |
          echo "✅ Module ${{ inputs.module_name }} released successfully"
          ls -la "${{ inputs.module_path }}/CHANGELOG.md" 2>/dev/null || echo "No changelog generated"
