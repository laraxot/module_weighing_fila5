<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="fixcity-title fixcity-description">
  <title id="fixcity-title">FixCity</title>
  <desc id="fixcity-description">Megafono cittadino in stile Heroicons outline</desc>

  <g fill="none" stroke="#123b5d" stroke-linecap="round" stroke-linejoin="round">
    <!-- Marchio compatto: nessun fondo, gradiente o filtro, quindi funziona su header e footer. -->
    <rect x="6" y="6" width="116" height="116" rx="30" stroke-width="3"/>

    <!-- Megafono: profilo chiuso, bocca ampia e manico separato per una resa nitida. -->
    <path stroke-width="4" d="M31 48 78 31v66L31 80a7 7 0 0 1 0-32Z"/>
    <path stroke-width="4" d="M78 31v66"/>
    <path stroke-width="4" d="m39 80-6 22a6 6 0 0 0 4 7l2 .6a6 6 0 0 0 7-4l7-23"/>

    <!-- Voce pubblica: onde distinte e non sovrapposte al corpo del megafono. -->
    <path stroke-width="4" d="M91 48a22 22 0 0 1 0 32"/>
    <path stroke-width="4" d="M101 38a36 36 0 0 1 0 52"/>

    <!-- Piccola base urbana, elemento distintivo del marchio senza introdurre testo nel file. -->
    <path stroke-width="3" d="M20 112h88"/>
    <path stroke-width="3" d="M25 112V99h10v13m8 0V91h11v21m9 0V96h10v16m8 0V87h12v25"/>
  </g>
</svg>
