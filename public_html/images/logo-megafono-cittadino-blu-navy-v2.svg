<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="logo-title-v2 logo-desc-v2" style="background:linear-gradient(135deg,#060d2b 0%,#0f1d4d 50%,#1a2e5a 100%);border-radius:50%;box-shadow:inset 0 0 40px rgba(255,255,255,0.05),0 8px 32px rgba(6,13,43,0.35);">
  <title id="logo-title-v2">Logo Megafono Cittadino in Blu Navy — FixCity</title>
  <desc id="logo-desc-v2">Icona stilizzata Heroicons Outline, versione v2: megafono cittadino con skyline, onde sonore e testo FIXCITY su gradiente navy profondo.</desc>

  <defs>
    <linearGradient id="grad-v2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1635" stop-opacity="1"/>
      <stop offset="50%" stop-color="#1a2e5a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f1f4d" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow-v2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cerchio esterno elegante -->
  <circle cx="128" cy="128" r="116" fill="url(#grad-v2)" stroke="#2a5db0" stroke-width="1.5" filter="url(#glow-v2)"/>
  <circle cx="128" cy="128" r="110" fill="none" stroke="#3a7ab8" stroke-width="0.8" opacity="0.5"/>

  <!-- Megafono stilizzato -->
  <g fill="none" stroke="#d8e8ff" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-v2)">
    <!-- Bocca -->
    <path d="M 60 92 L 120 72 C 135 68 145 78 140 92 L 130 115 L 80 128 L 60 115 Z" stroke-width="2.5"/>
    <!-- Impugnatura -->
    <line x1="82" y1="120" x2="82" y2="148" stroke-width="2"/>
    <line x1="74" y1="148" x2="90" y2="148" stroke-width="2"/>
    <!-- Cono / apertura -->
    <ellipse cx="138" cy="105" rx="20" ry="42" stroke-width="2" transform="rotate(-15 138 105)"/>
    <circle cx="152" cy="98" r="5" stroke-width="1.8" fill="#d8e8ff" opacity="0.9"/>
  </g>

  <!-- Onde sonore aperte -->
  <g stroke="#b0d4ff" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 170 82 Q 190 70 185 95 Q 180 125 200 110" opacity="0.7"/>
    <path d="M 175 102 Q 205 92 200 115 Q 195 140 215 125" opacity="0.5"/>
  </g>

  <!-- Skyline cittadino stilizzato -->
  <g stroke="#b8d4f0" stroke-width="1.4" fill="none" stroke-linejoin="round" opacity="0.9">
    <path d="M 30 152 L 45 130 L 60 145 L 75 120 L 90 135 L 105 110 L 120 125 L 135 100 L 150 120 L 165 105 L 180 125 L 195 110 L 210 130"/>
  </g>

  <!-- Edifici stilizzati (outline) -->
  <g stroke="#b8d4f0" stroke-width="1" fill="none" opacity="0.6">
    <rect x="50" y="130" width="10" height="22" rx="2"/>
    <rect x="80" y="120" width="12" height="32" rx="2"/>
    <rect x="110" y="110" width="14" height="42" rx="2"/>
    <rect x="140" y="100" width="10" height="52" rx="2"/>
    <rect x="170" y="120" width="12" height="32" rx="2"/>
  </g>

  <!-- Testo -->
  <text x="128" y="182" text-anchor="middle" fill="#d8e8ff" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="800" letter-spacing="3.5" style="text-shadow:0 2px 12px rgba(10,22,53,0.8);">
    FIXCITY
  </text>
</svg>
