# Roosko Local Development VirtualHost Configuration
# Server: roosko.local
# Document Root: public_html
# Camera e HTTPS: lo scanner QR richiede HTTPS (vedi roosko.local-ssl.conf o un reverse proxy)
#
# SSOT: This file is the canonical vhost config.
# Deploy: sudo cp laravel/config/vhost/roosko.local.conf /etc/apache2/sites-available/
# Reload: sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName roosko.local
    ServerAlias www.roosko.local

    DocumentRoot /var/www/_bases/base_roosko_fila5/public_html

    <Directory /var/www/_bases/base_roosko_fila5/public_html>
        Options -Indexes +FollowSymLinks +MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/roosko.local-error.log
    CustomLog ${APACHE_LOG_DIR}/roosko.local-access.log combined

    # Security headers
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
    </IfModule>
</VirtualHost>

# /etc/hosts entry:
# 127.0.0.1 roosko.local www.roosko.local
